name: Prod-CICD

on:
  push:
    branches: ["deploy/#56"]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::884348118723:role/Git-Action-Role
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: make application-secret.yml
        run: |
          cat <<EOF > ./src/main/resources/application-secret.yml
          ${{ secrets.DEV_APPLICATION_SECRET_YML }}
          EOF
        shell: bash

      - name: make analysis-chat-prompt.txt
        run: |
          cat <<EOF > ./src/main/resources/analysis-chat-prompt.txt
          ${{ secrets.ANALYSIS_CHAT_PROMPT }}
          EOF
        shell: bash

      - name: make chat-prompt.txt
        run: |
          cat <<EOF > ./src/main/resources/chat-prompt.txt
          ${{ secrets.CHAT_PROMPT }}
          EOF
        shell: bash

      - name: make recommend-subject-prompt.txt
        run: |
          cat <<EOF > ./src/main/resources/recommend-subject-prompt.txt
          ${{ secrets.RECOMMEND_SUBJECT_PROMPT }}
          EOF
        shell: bash

      - name: make analysis-feedback-prompt.txt
        run: |
          cat <<EOF > ./src/main/resources/analysis-feedback-prompt.txt
          ${{ secrets.ANALYSIS_FEEDBACK_PROMPT }}
          EOF
        shell: bash

      - name: make analysis-spelling-prompt.txt
        run: |
          cat <<EOF > ./src/main/resources/analysis-spelling-prompt.txt
          ${{ secrets.ANALYSIS_SPELLING_PROMPT }}
          EOF
        shell: bash

      - name: Build with gradle
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" > image.txt

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ secrets.ECS_TASK_NAME }} --query taskDefinition > task-definition.json

      - name: Remove unnecessary keys from task definition
        run: |
          jq 'del(.enableFaultInjection)' task-definition.json > task-definition-clean.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-clean.json
          container-name: ${{ secrets.ECS_CONTAINER_NAME }}
          image: $(cat image.txt)

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_NAME }}
          cluster: ${{ secrets.ECS_CLUSTER_NAME }}
          codedeploy-appspec: appspec.yml
          codedeploy-application: ${{ secrets.CODE_DEPLOY_APP_NAME }}
          codedeploy-deployment-group: ${{ secrets.CODE_DEPLOY_DG_NAME }}
          wait-for-service-stability: true
